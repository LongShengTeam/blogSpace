<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #e7e7e7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 860px;
            height: 640px;
            background: #f5f5f5;
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        /* 左侧：登录 + 在线用户列表 */
        .sidebar {
            width: 240px;
            background: #2e2e2e;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        .login-box {
            padding: 16px;
            background: #232323;
            border-bottom: 1px solid #1a1a1a;
        }

        .login-box .title {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 10px;
        }

        .login-box input {
            width: 100%;
            height: 34px;
            padding: 0 10px;
            border: none;
            border-radius: 4px;
            background: #3a3a3a;
            color: #fff;
            outline: none;
            margin-bottom: 8px;
        }

        .login-box input::placeholder {
            color: #888;
        }

        .login-box button {
            width: 100%;
            height: 34px;
            border: none;
            border-radius: 4px;
            background: #07c160;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .login-box button:disabled {
            background: #4a4a4a;
            cursor: not-allowed;
        }

        .user-list-header {
            padding: 12px 16px;
            font-size: 13px;
            color: #aaa;
            border-bottom: 1px solid #1a1a1a;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-item:hover {
            background: #3a3a3a;
        }

        .user-item.active {
            background: #3f3f3f;
        }

        .user-item .avatar {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            background: #07c160;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .user-item .name {
            font-size: 14px;
            color: #ddd;
        }

        /* 右侧：聊天区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            height: 54px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 16px;
            color: #333;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }

        .message.self {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 38px;
            height: 38px;
            border-radius: 4px;
            background: #07c160;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.self .avatar {
            background: #4a90d9;
        }

        .message .bubble {
            max-width: 60%;
            margin: 0 10px;
            padding: 10px 14px;
            background: #fff;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            word-break: break-word;
            position: relative;
        }

        .message.self .bubble {
            background: #95ec69;
        }

        .message .bubble::before {
            content: '';
            position: absolute;
            top: 14px;
            width: 0;
            height: 0;
            border: 6px solid transparent;
        }

        .message:not(.self) .bubble::before {
            left: -12px;
            border-right-color: #fff;
        }

        .message.self .bubble::before {
            right: -12px;
            border-left-color: #95ec69;
        }

        .system-msg {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin: 10px 0;
        }

        .chat-input {
            height: 120px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            padding: 10px 16px;
        }

        .chat-input textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            color: #333;
        }

        .chat-input .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-input .send-btn {
            width: 76px;
            height: 32px;
            border: none;
            border-radius: 4px;
            background: #07c160;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .chat-input .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .tip {
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <!-- 左侧栏 -->
    <div class="sidebar">
        <div class="login-box">
            <div class="title">请输入昵称登录</div>
            <input type="text" id="nickname" placeholder="昵称" maxlength="20">
            <button id="loginBtn">登录</button>
        </div>
        <div class="user-list-header">在线用户</div>
        <div class="user-list" id="userList"></div>
    </div>

    <!-- 右侧聊天区 -->
    <div class="main">
        <div class="chat-header" id="chatTitle">请选择一个用户开始聊天</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <textarea id="inputText" placeholder="输入消息，Ctrl+Enter 发送" disabled></textarea>
            <div class="actions">
                <span class="tip" id="statusTip">未连接</span>
                <button class="send-btn" id="sendBtn" disabled>发送</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        // Netty WebSocket 端口
        var WS_URL = 'ws://' + location.hostname + ':9000/ws';

        var socket = null;
        var myNickname = '';
        var currentTo = ''; // 当前聊天对象，空表示群聊

        var loginBtn = document.getElementById('loginBtn');
        var nicknameInput = document.getElementById('nickname');
        var userListEl = document.getElementById('userList');
        var chatTitle = document.getElementById('chatTitle');
        var chatMessages = document.getElementById('chatMessages');
        var inputText = document.getElementById('inputText');
        var sendBtn = document.getElementById('sendBtn');
        var statusTip = document.getElementById('statusTip');

        // 头像颜色池
        var colors = ['#07c160', '#4a90d9', '#f39c12', '#e74c3c', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'];

        function getColor(name) {
            var hash = 0;
            for (var i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function connect() {
            socket = new WebSocket(WS_URL);

            socket.onopen = function () {
                statusTip.textContent = '已连接';
                // 发送上线消息
                var msg = {
                    type: 2,
                    from: myNickname
                };
                socket.send(JSON.stringify(msg));
            };

            socket.onmessage = function (event) {
                handleMessage(JSON.parse(event.data));
            };

            socket.onclose = function () {
                statusTip.textContent = '连接断开，重连中...';
                setTimeout(function () {
                    if (myNickname) {
                        connect();
                    }
                }, 2000);
            };

            socket.onerror = function () {
                statusTip.textContent = '连接错误';
            };
        }

        function handleMessage(msg) {
            if (msg.type === 4) {
                // 在线用户列表更新
                renderUserList(JSON.parse(msg.content));
                return;
            }

            if (msg.type === 2) {
                // 上线通知
                addSystemMsg(msg.from + ' 上线了');
                return;
            }

            if (msg.type === 3) {
                addSystemMsg(msg.from + ' 下线了');
                return;
            }

            // 文本消息
            var isSelf = msg.from === myNickname;
            // 过滤：点对点消息只显示给发送方或接收方
            if (msg.to && !isSelf && msg.to !== myNickname) {
                return;
            }
            // 如果当前聊天对象是 msg.to（对方），或聊天对象是 msg.from
            if (msg.to && msg.to !== myNickname) {
                // 我是接收方
                if (currentTo === msg.from) {
                    addMessage(msg.from, msg.content, false);
                }
            } else if (msg.to === myNickname) {
                // 我发出的私聊消息回显
                if (currentTo === msg.from) {
                    addMessage(msg.from, msg.content, true);
                }
            } else {
                // 群聊
                if (!currentTo) {
                    addMessage(msg.from, msg.content, isSelf);
                }
            }
        }

        function renderUserList(users) {
            userListEl.innerHTML = '';

            // 群聊入口
            var group = document.createElement('div');
            group.className = 'user-item' + (currentTo === '' ? ' active' : '');
            group.innerHTML =
                '<div class="avatar" style="background:#607d8b;">群</div>' +
                '<div class="name">群聊</div>';
            group.onclick = function () {
                currentTo = '';
                switchChat('群聊');
                renderUserList(users);
            };
            userListEl.appendChild(group);

            users.forEach(function (name) {
                if (name === myNickname) return;
                var item = document.createElement('div');
                item.className = 'user-item' + (currentTo === name ? ' active' : '');
                var first = name.charAt(0);
                item.innerHTML =
                    '<div class="avatar" style="background:' + getColor(name) + ';">' + first + '</div>' +
                    '<div class="name">' + name + '</div>';
                item.onclick = function () {
                    currentTo = name;
                    switchChat(name);
                    renderUserList(users);
                };
                userListEl.appendChild(item);
            });
        }

        function switchChat(name) {
            chatTitle.textContent = name;
            chatMessages.innerHTML = '';
            inputText.disabled = false;
            sendBtn.disabled = false;
            addSystemMsg('正在与 ' + name + ' 聊天');
        }

        function addMessage(from, content, isSelf) {
            var div = document.createElement('div');
            div.className = 'message' + (isSelf ? ' self' : '');
            var first = from.charAt(0);
            div.innerHTML =
                '<div class="avatar" style="background:' + getColor(from) + ';">' + first + '</div>' +
                '<div class="bubble"></div>';
            div.querySelector('.bubble').textContent = content;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMsg(text) {
            var div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            var content = inputText.value.trim();
            if (!content || !socket || socket.readyState !== WebSocket.OPEN) {
                return;
            }
            var msg = {
                type: 1,
                from: myNickname,
                to: currentTo,
                content: content,
                timestamp: Date.now()
            };
            socket.send(JSON.stringify(msg));
            inputText.value = '';
            inputText.focus();
        }

        // 登录
        loginBtn.onclick = function () {
            var name = nicknameInput.value.trim();
            if (!name) {
                alert('请输入昵称');
                return;
            }
            myNickname = name;
            loginBtn.disabled = true;
            nicknameInput.disabled = true;
            connect();
        };

        // 发送按钮
        sendBtn.onclick = sendMessage;

        // 回车发送
        inputText.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    })();
</script>
</body>
</html>
