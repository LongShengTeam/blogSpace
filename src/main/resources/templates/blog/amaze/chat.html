<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #e7e7e7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 860px;
            height: 640px;
            background: #f5f5f5;
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        /* 左侧：登录 + 在线用户列表 */
        .sidebar {
            width: 240px;
            background: #2e2e2e;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        .login-box {
            padding: 16px;
            background: #232323;
            border-bottom: 1px solid #1a1a1a;
        }

        .login-box .title {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 10px;
        }

        .login-box input {
            width: 100%;
            height: 34px;
            padding: 0 10px;
            border: none;
            border-radius: 4px;
            background: #3a3a3a;
            color: #fff;
            outline: none;
            margin-bottom: 8px;
        }

        .login-box input::placeholder {
            color: #888;
        }

        .login-box button {
            width: 100%;
            height: 34px;
            border: none;
            border-radius: 4px;
            background: #07c160;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .login-box button:disabled {
            background: #4a4a4a;
            cursor: not-allowed;
        }

        .user-list-header {
            padding: 12px 16px;
            font-size: 13px;
            color: #aaa;
            border-bottom: 1px solid #1a1a1a;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-item:hover {
            background: #3a3a3a;
        }

        .user-item.active {
            background: #3f3f3f;
        }

        .user-item .avatar {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            background: #07c160;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .user-item .name {
            font-size: 14px;
            color: #ddd;
        }

        /* 右侧：聊天区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            height: 54px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 16px;
            color: #333;
            flex-shrink: 0;
        }

        .chat-header .video-btn {
            margin-left: auto;
            height: 30px;
            padding: 0 12px;
            border: none;
            border-radius: 4px;
            background: #07c160;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }

        .chat-header .video-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }

        .message.self {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 38px;
            height: 38px;
            border-radius: 4px;
            background: #07c160;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.self .avatar {
            background: #4a90d9;
        }

        .message .bubble {
            max-width: 60%;
            margin: 0 10px;
            padding: 10px 14px;
            background: #fff;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            word-break: break-word;
            position: relative;
        }

        .message.self .bubble {
            background: #95ec69;
        }

        .message .bubble::before {
            content: '';
            position: absolute;
            top: 14px;
            width: 0;
            height: 0;
            border: 6px solid transparent;
        }

        .message:not(.self) .bubble::before {
            left: -12px;
            border-right-color: #fff;
        }

        .message.self .bubble::before {
            right: -12px;
            border-left-color: #95ec69;
        }

        .system-msg {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin: 10px 0;
        }

        .chat-input {
            height: 120px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            padding: 10px 16px;
            flex-shrink: 0;
        }

        .chat-input textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            color: #333;
        }

        .chat-input .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-input .send-btn {
            width: 76px;
            height: 32px;
            border: none;
            border-radius: 4px;
            background: #07c160;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .chat-input .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .tip {
            font-size: 12px;
            color: #999;
        }

        /* 视频通话弹窗 */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .video-overlay.show {
            display: flex;
        }

        .video-box {
            position: relative;
            width: 720px;
            height: 480px;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-box .remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #222;
        }

        .video-box .local-video {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 160px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            background: #333;
            border: 2px solid #fff;
        }

        .video-box .video-name {
            position: absolute;
            top: 12px;
            left: 16px;
            color: #fff;
            font-size: 15px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .video-box .video-controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
        }

        .video-box .ctrl-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            color: #fff;
            font-size: 12px;
        }

        .video-box .ctrl-hangup {
            background: #e74c3c;
        }

        .video-box .ctrl-mute {
            background: #555;
        }

        /* 来电提示 */
        .incoming-box {
            text-align: center;
            color: #fff;
        }

        .incoming-box .avatar-big {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #07c160;
            color: #fff;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .incoming-box .incoming-name {
            font-size: 18px;
            margin-bottom: 24px;
        }

        .incoming-box .incoming-btns {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .incoming-box .accept-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #07c160;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }

        .incoming-box .reject-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #e74c3c;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <!-- 左侧栏 -->
    <div class="sidebar">
        <div class="login-box">
            <div class="title">请输入昵称登录</div>
            <input type="text" id="nickname" placeholder="昵称" maxlength="20">
            <button id="loginBtn">登录</button>
        </div>
        <div class="user-list-header">在线用户</div>
        <div class="user-list" id="userList"></div>
    </div>

    <!-- 右侧聊天区 -->
    <div class="main">
        <div class="chat-header">
            <span id="chatTitle">请选择一个用户开始聊天</span>
            <button class="video-btn" id="videoBtn" disabled>视频通话</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <textarea id="inputText" placeholder="输入消息，Enter 发送" disabled></textarea>
            <div class="actions">
                <span class="tip" id="statusTip">未连接</span>
                <button class="send-btn" id="sendBtn" disabled>发送</button>
            </div>
        </div>
    </div>
</div>

<!-- 视频通话弹窗 -->
<div class="video-overlay" id="videoOverlay">
    <div class="video-box" id="videoBox" style="display:none;">
        <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
        <video class="local-video" id="localVideo" autoplay playsinline muted></video>
        <div class="video-name" id="videoName"></div>
        <div class="video-controls">
            <button class="ctrl-btn ctrl-mute" id="muteBtn">静音</button>
            <button class="ctrl-btn ctrl-hangup" id="hangupBtn">挂断</button>
        </div>
    </div>

    <!-- 来电提示 -->
    <div class="incoming-box" id="incomingBox" style="display:none;">
        <div class="avatar-big" id="incomingAvatar"></div>
        <div class="incoming-name" id="incomingName"></div>
        <div class="incoming-btns">
            <button class="accept-btn" id="acceptBtn">接听</button>
            <button class="reject-btn" id="rejectBtn">拒绝</button>
        </div>
    </div>
</div>

<script>
    (function () {
        // 信令地址：优先走同域同端口的 /ws（配合 nginx 反代到 Netty 9000），
        // 通过 URL 参数 ?wsPort=9000 或 ?wsUrl=ws://... 可覆盖
        function resolveWsUrl() {
            var params = new URLSearchParams(location.search);
            if (params.get('wsUrl')) {
                return params.get('wsUrl');
            }
            var wsProtocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
            var port = params.get('wsPort') || '9000';
            // return wsProtocol + location.hostname + ':' + port + '/ws';
            return wsProtocol + location.hostname  + '/ws';
        }
        var WS_URL = resolveWsUrl();

        var socket = null;
        var myNickname = '';
        var currentTo = ''; // 当前聊天对象，空表示群聊

        var loginBtn = document.getElementById('loginBtn');
        var nicknameInput = document.getElementById('nickname');
        var userListEl = document.getElementById('userList');
        var chatTitle = document.getElementById('chatTitle');
        var chatMessages = document.getElementById('chatMessages');
        var inputText = document.getElementById('inputText');
        var sendBtn = document.getElementById('sendBtn');
        var statusTip = document.getElementById('statusTip');
        var videoBtn = document.getElementById('videoBtn');

        var videoOverlay = document.getElementById('videoOverlay');
        var videoBox = document.getElementById('videoBox');
        var incomingBox = document.getElementById('incomingBox');
        var remoteVideo = document.getElementById('remoteVideo');
        var localVideo = document.getElementById('localVideo');
        var videoName = document.getElementById('videoName');
        var incomingAvatar = document.getElementById('incomingAvatar');
        var incomingName = document.getElementById('incomingName');
        var acceptBtn = document.getElementById('acceptBtn');
        var rejectBtn = document.getElementById('rejectBtn');
        var hangupBtn = document.getElementById('hangupBtn');
        var muteBtn = document.getElementById('muteBtn');

        // WebRTC 相关
        var peerConnection = null;
        var localStream = null;
        var remoteUser = ''; // 当前通话对象
        var isCaller = false; // 是否发起方
        var muted = false;

        var colors = ['#07c160', '#4a90d9', '#f39c12', '#e74c3c', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'];

        function getColor(name) {
            var hash = 0;
            for (var i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function connect() {
            socket = new WebSocket(WS_URL);

            socket.onopen = function () {
                statusTip.textContent = '已连接';
                socket.send(JSON.stringify({ type: 2, from: myNickname }));
            };

            socket.onmessage = function (event) {
                handleMessage(JSON.parse(event.data));
            };

            socket.onclose = function () {
                statusTip.textContent = '连接断开，重连中...';
                setTimeout(function () {
                    if (myNickname) connect();
                }, 2000);
            };

            socket.onerror = function () {
                statusTip.textContent = '连接错误';
            };
        }

        function handleMessage(msg) {
            if (msg.type === 4) {
                renderUserList(JSON.parse(msg.content));
                return;
            }
            if (msg.type === 2) {
                addSystemMsg(msg.from + ' 上线了');
                return;
            }
            if (msg.type === 3) {
                addSystemMsg(msg.from + ' 下线了');
                return;
            }

            // 视频信令
            if (msg.type >= 10 && msg.type <= 16) {
                handleSignal(msg);
                return;
            }

            // 文本消息
            var isSelf = msg.from === myNickname;
            if (msg.to && !isSelf && msg.to !== myNickname) return;
            if (msg.to && msg.to !== myNickname) {
                if (currentTo === msg.from) addMessage(msg.from, msg.content, false);
            } else if (msg.to === myNickname) {
                if (currentTo === msg.from) addMessage(msg.from, msg.content, true);
            } else {
                if (!currentTo) addMessage(msg.from, msg.content, isSelf);
            }
        }

        /* ==================== 视频通话信令处理 ==================== */

        function sendSignal(type, to, content) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify({
                type: type,
                from: myNickname,
                to: to,
                content: content,
                timestamp: Date.now()
            }));
        }

        // 发起视频通话
        function startCall() {
            if (!currentTo) {
                alert('请先选择一个用户');
                return;
            }
            remoteUser = currentTo;
            isCaller = true;
            showVideoBox(remoteUser);
            getLocalStream(function () {
                createPeerConnection();
                // 创建 offer
                peerConnection.createOffer()
                    .then(function (offer) {
                        return peerConnection.setLocalDescription(offer);
                    })
                    .then(function () {
                        sendSignal(14, remoteUser, JSON.stringify(peerConnection.localDescription));
                    });
            });
            // 发送邀请
            sendSignal(10, remoteUser, '');
        }

        // 收到邀请
        function onIncomingCall(from) {
            if (remoteUser && peerConnection) {
                // 忙，直接拒绝
                sendSignal(12, from, '');
                return;
            }
            remoteUser = from;
            isCaller = false;
            showIncomingBox(from);
        }

        function acceptCall() {
            showVideoBox(remoteUser);
            getLocalStream(function () {
                createPeerConnection();
            });
            sendSignal(11, remoteUser, '');
        }

        function rejectCall() {
            sendSignal(12, remoteUser, '');
            closeVideo();
        }

        function hangup() {
            sendSignal(13, remoteUser, '');
            closeVideo();
        }

        function handleSignal(msg) {
            var type = msg.type;
            var from = msg.from;

            switch (type) {
                case 10: // 邀请
                    if (from !== myNickname) onIncomingCall(from);
                    break;
                case 11: // 接受
                    if (from === remoteUser && isCaller) {
                        // 对方接受，此时 offer 已发，等待 answer 或 ICE
                    }
                    break;
                case 12: // 拒绝
                    if (from === remoteUser) {
                        addSystemMsg('对方拒绝了视频通话');
                        closeVideo();
                    }
                    break;
                case 13: // 挂断
                    if (from === remoteUser) {
                        addSystemMsg('对方已挂断');
                        closeVideo();
                    }
                    break;
                case 14: // offer
                    if (from === remoteUser && !isCaller) {
                        // 接听方收到 offer
                        if (!peerConnection) {
                            getLocalStream(function () {
                                createPeerConnection();
                                var desc = JSON.parse(msg.content);
                                peerConnection.setRemoteDescription(new RTCSessionDescription(desc)).then(function () {
                                    return peerConnection.createAnswer();
                                }).then(function (answer) {
                                    return peerConnection.setLocalDescription(answer);
                                }).then(function () {
                                    sendSignal(15, remoteUser, JSON.stringify(peerConnection.localDescription));
                                });
                            });
                        }
                    }
                    break;
                case 15: // answer
                    if (from === remoteUser && isCaller) {
                        var ansDesc = JSON.parse(msg.content);
                        peerConnection.setRemoteDescription(new RTCSessionDescription(ansDesc));
                    }
                    break;
                case 16: // ICE
                    if (from === remoteUser && peerConnection) {
                        var candidate = JSON.parse(msg.content);
                        peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                    }
                    break;
            }
        }

        /* ==================== WebRTC 核心 ==================== */

        // 枚举系统识别到的摄像头/麦克风，用于诊断
        function getDeviceDiagnose() {
            var msg = '系统识别到的设备：';
            navigator.mediaDevices.enumerateDevices().then(function (devices) {
                var cams = devices.filter(function (d) { return d.kind === 'videoinput'; });
                var mics = devices.filter(function (d) { return d.kind === 'audioinput'; });
                msg += '\n摄像头 ' + cams.length + ' 个' +
                    (cams.length ? '：' + cams.map(function (d) { return d.label || '(未命名)'; }).join('、') : '（未识别到摄像头）');
                msg += '\n麦克风 ' + mics.length + ' 个' +
                    (mics.length ? '：' + mics.map(function (d) { return d.label || '(未命名)'; }).join('、') : '（未识别到麦克风）');
                if (!cams.length && !mics.length) {
                    msg += '\n\n提示：系统未识别到任何摄像头和麦克风，请检查设备管理器中的“照相机”和“音频输入和输出”是否正常，必要时重装驱动。';
                }
                alert(msg);
            }).catch(function () {
                alert('无法枚举设备列表。');
            });
            return '';
        }

        function getLocalStream(callback) {
            if (localStream) {
                callback();
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                if (!window.isSecureContext) {
                    alert('当前页面不是安全上下文（HTTPS 或 localhost），浏览器禁用了摄像头/麦克风 API。\n\n' +
                        '解决方式（任选其一）：\n' +
                        '1. 手机/电脑 Chrome 打开 chrome://flags/#unsafely-treat-insecure-origin-as-secure\n' +
                        '   把 ' + location.origin + ' 填入并启用，重启浏览器；\n' +
                        '2. 使用 HTTPS 访问（推荐）。');
                } else {
                    alert('当前浏览器不支持 getUserMedia，请使用最新版 Chrome/Edge/Firefox。');
                }
                if (isCaller) { sendSignal(13, remoteUser, ''); closeVideo(); }
                return;
            }
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(function (stream) {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    callback();
                })
                .catch(function (err) {
                    var tips;
                    switch (err.name) {
                        case 'NotAllowedError':
                        case 'PermissionDeniedError':
                            tips = '摄像头/麦克风权限被拒绝。\n请在地址栏左侧图标里允许摄像头和麦克风权限，\n并检查系统“隐私设置”中是否允许浏览器访问相机/麦克风。';
                            break;
                        case 'NotFoundError':
                        case 'DevicesNotFoundError':
                            tips = '未找到摄像头/麦克风设备。\n' + getDeviceDiagnose();
                            break;
                        case 'NotReadableError':
                        case 'TrackStartError':
                            tips = '摄像头/麦克风被其他程序占用，请关闭占用设备的软件后重试。';
                            break;
                        case 'OverconstrainedError':
                            tips = '没有满足要求的摄像头/麦克风设备。';
                            break;
                        default:
                            tips = '无法获取摄像头/麦克风。';
                    }
                    alert(tips + '\n\n错误信息：' + err.name + ' - ' + err.message);
                    if (isCaller) {
                        sendSignal(13, remoteUser, '');
                        closeVideo();
                    }
                });
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            });

            // 添加本地流
            if (localStream) {
                localStream.getTracks().forEach(function (track) {
                    peerConnection.addTrack(track, localStream);
                });
            }

            // 远端流
            peerConnection.ontrack = function (event) {
                remoteVideo.srcObject = event.streams[0];
            };

            // ICE 候选
            peerConnection.onicecandidate = function (event) {
                if (event.candidate) {
                    sendSignal(16, remoteUser, JSON.stringify(event.candidate));
                }
            };
        }

        function showVideoBox(name) {
            incomingBox.style.display = 'none';
            videoBox.style.display = 'block';
            videoOverlay.classList.add('show');
            videoName.textContent = '与 ' + name + ' 视频通话中';
        }

        function showIncomingBox(name) {
            videoBox.style.display = 'none';
            incomingBox.style.display = 'block';
            videoOverlay.classList.add('show');
            incomingName.textContent = name + ' 邀请你视频通话';
            incomingAvatar.textContent = name.charAt(0);
            incomingAvatar.style.background = getColor(name);
        }

        function closeVideo() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(function (track) {
                    track.stop();
                });
                localStream = null;
            }
            remoteVideo.srcObject = null;
            localVideo.srcObject = null;
            videoOverlay.classList.remove('show');
            videoBox.style.display = 'none';
            incomingBox.style.display = 'none';
            remoteUser = '';
            isCaller = false;
            muted = false;
            muteBtn.textContent = '静音';
        }

        /* ==================== UI ==================== */

        function renderUserList(users) {
            userListEl.innerHTML = '';

            var group = document.createElement('div');
            group.className = 'user-item' + (currentTo === '' ? ' active' : '');
            group.innerHTML =
                '<div class="avatar" style="background:#607d8b;">群</div>' +
                '<div class="name">群聊</div>';
            group.onclick = function () {
                currentTo = '';
                switchChat('群聊');
                renderUserList(users);
            };
            userListEl.appendChild(group);

            users.forEach(function (name) {
                if (name === myNickname) return;
                var item = document.createElement('div');
                item.className = 'user-item' + (currentTo === name ? ' active' : '');
                var first = name.charAt(0);
                item.innerHTML =
                    '<div class="avatar" style="background:' + getColor(name) + ';">' + first + '</div>' +
                    '<div class="name">' + name + '</div>';
                item.onclick = function () {
                    currentTo = name;
                    switchChat(name);
                    renderUserList(users);
                };
                userListEl.appendChild(item);
            });
        }

        function switchChat(name) {
            chatTitle.textContent = name;
            chatMessages.innerHTML = '';
            inputText.disabled = false;
            sendBtn.disabled = false;
            videoBtn.disabled = (name === '群聊');
            addSystemMsg('正在与 ' + name + ' 聊天');
        }

        function addMessage(from, content, isSelf) {
            var div = document.createElement('div');
            div.className = 'message' + (isSelf ? ' self' : '');
            div.innerHTML =
                '<div class="avatar" style="background:' + getColor(from) + ';">' + from.charAt(0) + '</div>' +
                '<div class="bubble"></div>';
            div.querySelector('.bubble').textContent = content;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMsg(text) {
            var div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            var content = inputText.value.trim();
            if (!content || !socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify({
                type: 1,
                from: myNickname,
                to: currentTo,
                content: content,
                timestamp: Date.now()
            }));
            inputText.value = '';
            inputText.focus();
        }

        /* ==================== 事件绑定 ==================== */

        loginBtn.onclick = function () {
            var name = nicknameInput.value.trim();
            if (!name) {
                alert('请输入昵称');
                return;
            }
            myNickname = name;
            loginBtn.disabled = true;
            nicknameInput.disabled = true;
            connect();
        };

        sendBtn.onclick = sendMessage;

        inputText.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        videoBtn.onclick = startCall;
        acceptBtn.onclick = acceptCall;
        rejectBtn.onclick = rejectCall;
        hangupBtn.onclick = hangup;

        muteBtn.onclick = function () {
            if (!localStream) return;
            muted = !muted;
            localStream.getAudioTracks().forEach(function (track) {
                track.enabled = !muted;
            });
            muteBtn.textContent = muted ? '取消静音' : '静音';
        };
    })();
</script>
</body>
</html>
